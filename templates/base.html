<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}DP-800 Study App{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="topNav">
  <div class="container-fluid px-4">
    <a class="navbar-brand d-flex align-items-center gap-2" href="/">
      <div class="brand-icon"><i class="fas fa-database"></i></div>
      <div>
        <span class="brand-title">DP-800</span>
        <span class="brand-sub d-none d-md-inline"> Study App</span>
      </div>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navContent">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='index' %}active{% endif %}" href="/"><i class="fas fa-home me-1"></i>Dashboard</a></li>
        <li class="nav-item"><a class="nav-link {% if request.endpoint=='mindmap' %}active{% endif %}" href="/mindmap"><i class="fas fa-project-diagram me-1"></i>Mind Map</a></li>
        <li class="nav-item ms-2">
          <button class="btn btn-sm btn-outline-danger" onclick="confirmReset()">
            <i class="fas fa-redo me-1"></i>Reset Progress
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="page-wrapper">
  {% block content %}{% endblock %}
</div>

<div class="modal fade" id="resetModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content border-0 shadow-lg">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title"><i class="fas fa-exclamation-triangle me-2"></i>Reset All Progress?</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>This will permanently delete all quiz scores and completion status. Are you sure?</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-danger" onclick="doReset()">Yes, Reset Everything</button>
      </div>
    </div>
  </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="toastMsg" class="toast align-items-center text-white bg-success border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastText">Done!</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/sql.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
<script>
  hljs.highlightAll();
  function confirmReset() { new bootstrap.Modal(document.getElementById('resetModal')).show(); }
  function doReset() {
    fetch('/api/reset', {method:'POST'}).then(() => {
      bootstrap.Modal.getInstance(document.getElementById('resetModal')).hide();
      showToast('Progress reset!', 'success');
      setTimeout(() => location.reload(), 1200);
    });
  }
  function showToast(msg, type='success') {
    const t = document.getElementById('toastMsg');
    t.className = `toast align-items-center text-white bg-${type} border-0`;
    document.getElementById('toastText').textContent = msg;
    new bootstrap.Toast(t, {delay: 2800}).show();
  }
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
